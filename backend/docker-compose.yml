name: rydex

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rydex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rydex
      POSTGRES_PASSWORD: rydex
      POSTGRES_DB: rydex
    ports:
      - '5432:5432'
    volumes:
      - rydex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rydex']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rydex-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - rydex_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rydex_postgres_data:
  rydex_redis_data:
